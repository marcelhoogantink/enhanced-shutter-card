name: Release

on:
  release:
    types: [published]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          echo "Built file:"
          ls -lah dist/
          echo "First 5 lines:"
          head -5 dist/enhanced-shutter-card.js

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/enhanced-shutter-card.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
