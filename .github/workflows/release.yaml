name: Release Enhanced Shutter Card

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      BASE: enhanced-shutter-card

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Install dependencies (optional)
        run: |
          if [ -f package.json ]; then npm ci; fi

      - name: Build (if applicable)
        run: |
          if [ -f package.json ]; then npm run build; fi

      - name: Inject version into JS (cache-safe)
        run: |
          VERSION=${{ steps.version.outputs.version }}

          FILE="dist/${BASE}.js"

          # Append version constant for runtime access
          echo "" >> "$FILE"
          echo "window.${BASE}_version = \"$VERSION\";" >> "$FILE"

      - name: Create HACS manifest (stable filename)
        run: |
          jq '.filename = "enhanced-shutter-card.js"' hacs.json > hacs.release.json

      - name: Rename build to stable HACS filename
        run: |
          cp dist/${BASE}.js dist/enhanced-shutter-card.js

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.version }}
          tag_name: ${{ github.ref_name }}
          files: |
            dist/enhanced-shutter-card.js
            hacs.release.json
