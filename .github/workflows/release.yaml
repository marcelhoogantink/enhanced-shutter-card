name: Release
on:
  release:
    types: [published]
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci
        
      - name: Build
        run: npm run build
        
#      - name: Inject version
#        run: |
#          VERSION=${GITHUB_REF_NAME#v}
#          sed -i "1s;^;window.enhanced_shutter_card_version='${VERSION}';\n;" dist/enhanced-shutter-card.js
          
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**
          generate_release_notes: true
