name: Release Enhanced Shutter Card

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      BASE: enhanced-shutter-card

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build versioned JS file
        run: |
          set -e

          VERSION=${{ steps.version.outputs.version }}

          SOURCE="dist/${BASE}.js"
          OUT="dist/${BASE}-v${VERSION}.js"

          cp "$SOURCE" "$OUT"
          echo "Created $OUT"

      - name: Create HACS manifest for release
        run: |
          VERSION=${{ steps.version.outputs.version }}
          FILE="${BASE}-v${VERSION}.js"

          jq --arg file "$FILE" '.filename = $file' hacs.json > hacs.release.json

          echo "Generated hacs.release.json"

      - name: Create GitHub Release + upload assets
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.version }}
          tag_name: ${{ github.ref_name }}
          files: |
            dist/${{ env.BASE }}-v${{ steps.version.outputs.version }}.js
            hacs.release.json
