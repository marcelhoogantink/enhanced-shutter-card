name: Release

on:
  release:
    types: [published]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Copy lit and images to dist
        run: |
          cp -r lit/ dist/lit/
          cp -r images/ dist/images/
          
      - name: Verify build output
        run: |
          echo "Built file:"
          ls -lah dist/
          ls -lah dist/lit/
          ls -lah dist/images/          
          echo "First 5 lines:"
          head -5 dist/enhanced-shutter-card.js

      - name: Upload build artifact
        uses: actions/upload-artifact@v6.0.0
        with:
          name: enhanced-shutter-card
          path: dist/    
      
      - name: Create release zip
        if: github.event_name == 'release'
        run: zip -r enhanced-shutter-card.zip dist/

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: enhanced-shutter-card.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
