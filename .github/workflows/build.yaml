name: Build

on:
  push:
    branches:
      - '**'  
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Copy lit and images to dist
        run: |
          rm -rf dist/lit dist/images
          cp -r card/lit/. dist/lit/
          cp -r card/images/. dist/images/

      - name: Commit dist to repo
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add dist/
          git diff --staged --quiet || git commit -m "Build dist"
          git push
